<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction Result — CityBank Gateway</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏦</text></svg>">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');

    :root {
      --bg-primary: #0f0f1a;
      --bg-card: rgba(26, 26, 46, 0.9);
      --bg-card-elevated: rgba(32, 32, 58, 0.95);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-input: rgba(255, 255, 255, 0.12);
      --text-primary: #f0f0f5;
      --text-secondary: #a0a0b8;
      --text-muted: #6b6b85;
      --accent-gradient: linear-gradient(135deg, #6c63ff 0%, #a855f7 50%, #ec4899 100%);
      --accent-violet: #6c63ff;
      --success: #22c55e;
      --error: #ef4444;
      --warning: #f59e0b;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.05);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px 80px;
    }

    /* Animated background */
    .bg-animation { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
    .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.12; animation: drift 18s ease-in-out infinite alternate; }
    .orb:nth-child(1) { width: 500px; height: 500px; background: #6c63ff; top: -150px; left: -150px; animation-duration: 22s; }
    .orb:nth-child(2) { width: 400px; height: 400px; background: #ec4899; top: 40%; right: -100px; animation-duration: 18s; animation-delay: -4s; }
    .orb:nth-child(3) { width: 350px; height: 350px; background: #a855f7; bottom: -100px; left: 30%; animation-duration: 26s; animation-delay: -8s; }
    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 30px) scale(1.08); }
    }

    /* Header */
    .app-header {
      position: relative; z-index: 10;
      width: 100%; max-width: 780px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 24px 0 0;
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon { font-size: 28px; }
    .logo-text { font-size: 18px; font-weight: 700; }
    .logo-text span { background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-badge {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      font-size: 12px; font-weight: 500; color: var(--text-muted);
    }

    /* Main Container */
    .main { position: relative; z-index: 10; width: 100%; max-width: 780px; margin-top: 36px; }

    /* Status Hero */
    .status-hero {
      text-align: center;
      padding: 46px 32px 36px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(20px);
      margin-bottom: 20px;
      animation: heroIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .status-hero.success { border-color: rgba(34,197,94,0.2); }
    .status-hero.failure { border-color: rgba(239,68,68,0.2); }

    @keyframes heroIn {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .status-icon-wrap {
      width: 90px; height: 90px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 22px; font-size: 42px;
    }
    .status-icon-wrap.success {
      background: radial-gradient(circle at 40% 40%, rgba(34,197,94,0.25), rgba(34,197,94,0.05));
      box-shadow: 0 0 0 2px rgba(34,197,94,0.35), 0 0 45px rgba(34,197,94,0.2);
    }
    .status-icon-wrap.failure {
      background: radial-gradient(circle at 40% 40%, rgba(239,68,68,0.25), rgba(239,68,68,0.05));
      box-shadow: 0 0 0 2px rgba(239,68,68,0.35), 0 0 45px rgba(239,68,68,0.2);
    }
    .status-icon-wrap.unknown {
      background: radial-gradient(circle at 40% 40%, rgba(245,158,11,0.25), rgba(245,158,11,0.05));
      box-shadow: 0 0 0 2px rgba(245,158,11,0.35), 0 0 45px rgba(245,158,11,0.2);
    }

    .status-title {
      font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px;
    }
    .status-title.success { color: #4ade80; }
    .status-title.failure { color: #f87171; }
    .status-title.unknown { color: #fbbf24; }

    .status-message {
      font-size: 14px; color: var(--text-secondary); margin-bottom: 24px; line-height: 1.5;
    }

    .badge-row { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }

    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 20px;
      font-size: 12px; font-weight: 700; letter-spacing: 0.4px;
    }
    .badge.success-badge { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3); color: #4ade80; }
    .badge.failure-badge { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #f87171; }
    .badge.unknown-badge { background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.3); color: #fbbf24; }
    .badge.neutral-badge { background: rgba(255,255,255,0.04); border: 1px solid var(--border-subtle); color: var(--text-secondary); }

    /* Summary Strip */
    .summary-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .summary-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      backdrop-filter: blur(20px);
    }
    .summary-card .s-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.8px; color: var(--text-muted); margin-bottom: 6px;
    }
    .summary-card .s-value {
      font-size: 13.5px; font-weight: 600; color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      word-break: break-all;
    }
    .summary-card.highlight { border-color: rgba(108,99,255,0.25); background: rgba(108,99,255,0.06); }
    .summary-card.highlight .s-value { color: #c4b5fd; }

    /* Full Payload Card */
    .payload-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(20px);
      overflow: hidden;
      margin-bottom: 20px;
    }
    .payload-card-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 22px;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(255,255,255,0.02);
    }
    .payload-card-header h3 { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
    .payload-card-header .meta { font-size: 11px; color: var(--text-muted); }

    .payload-table { width: 100%; border-collapse: collapse; }
    .payload-table tr:last-child td { border-bottom: none; }
    .payload-table td {
      padding: 12px 22px;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 13px; vertical-align: middle;
    }
    .payload-table td.col-key {
      color: var(--text-muted);
      font-weight: 600; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.5px;
      width: 38%; white-space: nowrap;
    }
    .payload-table td.col-val {
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      word-break: break-all;
    }
    .payload-table tr:hover td { background: rgba(255,255,255,0.015); }
    .status-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 10px; border-radius: 12px;
      font-size: 11px; font-weight: 700;
    }
    .status-chip.s { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
    .status-chip.f { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }

    /* Actions */
    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 10px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 22px; border: none; border-radius: var(--radius-sm);
      font-family: inherit; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: var(--transition); text-decoration: none; white-space: nowrap;
    }
    .btn-primary { background: var(--accent-gradient); color: white; box-shadow: 0 4px 15px rgba(108,99,255,0.3); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(108,99,255,0.4); }
    .btn-dialogue {
      background: rgba(108,99,255,0.15);
      border: 1px solid rgba(108,99,255,0.35);
      color: #c4b5fd;
    }
    .btn-dialogue:hover { background: rgba(108,99,255,0.25); transform: translateY(-2px); }
    .btn-ghost { background: rgba(255,255,255,0.04); border: 1px solid var(--border-subtle); color: var(--text-secondary); }
    .btn-ghost:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }

    /* =========================================================================
       DIALOGUE MODAL (POPUP)
       ========================================================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 20, 0.75);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-dialog {
      background: #18182c;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.08);
      width: 100%;
      max-width: 540px;
      overflow: hidden;
      transform: scale(0.92) translateY(20px);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-backdrop.open .modal-dialog {
      transform: scale(1) translateY(0);
    }

    .modal-dialog.success {
      border-color: rgba(34, 197, 94, 0.3);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(34, 197, 94, 0.15);
    }
    .modal-dialog.failure {
      border-color: rgba(239, 68, 68, 0.3);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(239, 68, 68, 0.15);
    }

    /* Modal Top Bar */
    .modal-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 22px;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.02);
    }
    .modal-topbar-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .modal-close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }
    .modal-close-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
    }

    /* Modal Body */
    .modal-body {
      padding: 28px 24px 20px;
      text-align: center;
    }

    .modal-status-icon {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 36px;
    }
    .modal-status-icon.success {
      background: radial-gradient(circle at 40% 40%, rgba(34, 197, 94, 0.25), rgba(34, 197, 94, 0.05));
      box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.35), 0 0 35px rgba(34, 197, 94, 0.25);
    }
    .modal-status-icon.failure {
      background: radial-gradient(circle at 40% 40%, rgba(239, 68, 68, 0.25), rgba(239, 68, 68, 0.05));
      box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.35), 0 0 35px rgba(239, 68, 68, 0.25);
    }

    .modal-status-heading {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }
    .modal-status-heading.success { color: #4ade80; }
    .modal-status-heading.failure { color: #f87171; }

    .modal-status-desc {
      font-size: 13.5px;
      color: var(--text-secondary);
      margin-bottom: 22px;
      line-height: 1.4;
    }

    /* Modal Payload Grid */
    .modal-payload-box {
      background: rgba(15, 15, 26, 0.6);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-bottom: 20px;
      text-align: left;
    }
    .modal-payload-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 12.5px;
    }
    .modal-payload-row:last-child {
      border-bottom: none;
    }
    .modal-payload-label {
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.5px;
    }
    .modal-payload-value {
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      word-break: break-all;
      text-align: right;
      max-width: 65%;
    }

    /* Modal Actions */
    .modal-actions {
      display: flex;
      gap: 10px;
      padding: 16px 24px 22px;
      border-top: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.015);
    }
    .modal-actions .btn {
      flex: 1;
      justify-content: center;
    }

    /* Empty state */
    .empty-state { text-align: center; padding: 70px 24px; color: var(--text-muted); }
    .empty-state .icon { font-size: 50px; margin-bottom: 14px; display: block; opacity: 0.6; }
    .empty-state h2 { font-size: 18px; color: var(--text-secondary); margin-bottom: 8px; }
    .empty-state p { font-size: 13.5px; line-height: 1.6; }
    .empty-state code { background: rgba(255,255,255,0.06); padding: 2px 8px; border-radius: 4px; font-size: 12px; }
  </style>
</head>

<body>

  <div class="bg-animation">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>

  <header class="app-header">
    <div class="logo">
      <div class="logo-icon">🏦</div>
      <div class="logo-text"><span>CityBank</span> Payment Tester</div>
    </div>
    <div class="header-badge">📬 Merchant Callback</div>
  </header>

  <main class="main" id="main"></main>

  <!-- =======================================================================
       DIALOGUE MODAL (POPUP)
       ======================================================================= -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-dialog" id="modalDialog">
      <div class="modal-topbar">
        <div class="modal-topbar-title">
          <span>🏦 CityBank Transaction Dialogue</span>
        </div>
        <button type="button" class="modal-close-btn" onclick="closeModal()" title="Close">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <script>
    // ── Incoming Callback Payload ───────────────────────────────────────────
    // When Citytouch POSTs data, server injects window.__CALLBACK_PAYLOAD__
    // Fallback to URL query params
    const isRealCallback = typeof window.__CALLBACK_PAYLOAD__ !== 'undefined';
    let params = isRealCallback
      ? window.__CALLBACK_PAYLOAD__
      : Object.fromEntries(new URLSearchParams(window.location.search));

    // If page opened with no params at all, provide the demo payload so dialogue can be previewed
    if (Object.keys(params).length === 0) {
      params = {
        txnStatus: '1',
        merchanRefNo: 'DEV',
        transactionId: 'NOV24-302fc395-f748-450e-859f-9a6296d610eb',
        txnamount: '23.9'
      };
    }

    const receivedAt = isRealCallback
      ? window.__CALLBACK_RECEIVED_AT__
      : new Date().toISOString();
    const paramCount = Object.keys(params).length;

    function esc(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function decode(v) {
      try { return decodeURIComponent(v); } catch { return v; }
    }

    // ── Status detection: txnStatus 1 = Success, 0 = Failure ────────────────
    function detectStatus(p) {
      if (p.txnStatus !== undefined) {
        return String(p.txnStatus).trim() === '1' ? 'success' : 'failure';
      }
      const successVals = new Set(['1', '100', '0', '00', 'SUCCESS', 'APPROVED']);
      const raw = p.status || p.Status || p.responseCode || p.result;
      if (raw !== undefined) {
        return successVals.has(String(raw).toUpperCase()) ? 'success' : 'failure';
      }
      return 'failure';
    }

    const statusType = detectStatus(params);
    const isSuccess = statusType === 'success';

    const META = {
      success: {
        icon: '✅',
        cssClass: 'success',
        dialogTitle: 'Payment Successful',
        dialogDesc: 'Transaction was authorized and confirmed by CityBank Gateway.',
        badgeLabel: 'TXN STATUS: 1 — SUCCESS',
        badgeCss: 'success-badge',
        chipCss: 's',
        chipLabel: '1 — Success'
      },
      failure: {
        icon: '❌',
        cssClass: 'failure',
        dialogTitle: 'Payment Failed',
        dialogDesc: 'Transaction was declined or failed to process by CityBank Gateway.',
        badgeLabel: 'TXN STATUS: 0 — FAILED',
        badgeCss: 'failure-badge',
        chipCss: 'f',
        chipLabel: '0 — Failure'
      }
    };

    const meta = META[statusType];
    const FIELD_LABELS = {
      txnStatus:     'Transaction Status',
      transactionId: 'Transaction ID',
      merchanRefNo:  'Merchant Ref No',
      txnamount:     'Amount (NPR)',
      status:        'Status',
      message:       'Message'
    };

    // ── Render Main Page Background Content ──────────────────────────────────
    const main = document.getElementById('main');
    const now = new Date(receivedAt).toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'medium', hour12: true });

    main.innerHTML = `
      <div class="status-hero ${meta.cssClass}">
        <div class="status-icon-wrap ${meta.cssClass}">${meta.icon}</div>
        <div class="status-title ${meta.cssClass}">${meta.dialogTitle}</div>
        <div class="status-message">${meta.dialogDesc}</div>
        <div class="badge-row">
          <span class="badge ${meta.badgeCss}">${meta.badgeLabel}</span>
          <span class="badge neutral-badge">📱 ${isRealCallback ? 'Received from Citytouch' : 'Callback Payload'}</span>
          <span class="badge neutral-badge">🕐 ${esc(now)}</span>
        </div>
      </div>

      <div class="summary-strip">
        <div class="summary-card highlight">
          <div class="s-label">Transaction ID</div>
          <div class="s-value">${esc(params.transactionId || '—')}</div>
        </div>
        <div class="summary-card">
          <div class="s-label">Merchant Ref No</div>
          <div class="s-value">${esc(params.merchanRefNo || '—')}</div>
        </div>
        <div class="summary-card highlight">
          <div class="s-label">Amount (NPR)</div>
          <div class="s-value">${params.txnamount ? 'Rs. ' + esc(params.txnamount) : '—'}</div>
        </div>
      </div>

      <div class="payload-card">
        <div class="payload-card-header">
          <h3>📦 Received Response Payload</h3>
          <span class="meta">${paramCount} field${paramCount !== 1 ? 's' : ''}</span>
        </div>
        <table class="payload-table">
          ${Object.entries(params).map(([k, v]) => `
            <tr>
              <td class="col-key">${esc(FIELD_LABELS[k] || k)}</td>
              <td class="col-val">
                ${k === 'txnStatus'
                  ? `<span class="status-chip ${isSuccess ? 's' : 'f'}">${isSuccess ? '1 — Success' : '0 — Failure'}</span>`
                  : esc(decode(v))}
              </td>
            </tr>
          `).join('')}
        </table>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-dialogue" onclick="openModal()">
          💬 View Dialogue Popup
        </button>
        <a href="/" class="btn btn-primary">← Test Another Payment</a>
      </div>
    `;

    // ── Populate & Open Dialogue Modal ───────────────────────────────────────
    function populateModal() {
      const modalDialog = document.getElementById('modalDialog');
      const modalBody = document.getElementById('modalBody');
      const modalActions = document.getElementById('modalActions');

      modalDialog.className = `modal-dialog ${meta.cssClass}`;

      modalBody.innerHTML = `
        <div class="modal-status-icon ${meta.cssClass}">${meta.icon}</div>
        <div class="modal-status-heading ${meta.cssClass}">${meta.dialogTitle}</div>
        <div class="modal-status-desc">${meta.dialogDesc}</div>

        <div class="modal-payload-box">
          <div class="modal-payload-row">
            <span class="modal-payload-label">Status</span>
            <span class="modal-payload-value">
              <span class="status-chip ${isSuccess ? 's' : 'f'}">
                ${isSuccess ? '1 — Success' : '0 — Failure'}
              </span>
            </span>
          </div>

          <div class="modal-payload-row">
            <span class="modal-payload-label">Transaction ID</span>
            <span class="modal-payload-value" style="color:#c4b5fd;">
              ${esc(params.transactionId || '—')}
            </span>
          </div>

          <div class="modal-payload-row">
            <span class="modal-payload-label">Merchant Ref No</span>
            <span class="modal-payload-value">
              ${esc(params.merchanRefNo || '—')}
            </span>
          </div>

          <div class="modal-payload-row">
            <span class="modal-payload-label">Amount (NPR)</span>
            <span class="modal-payload-value" style="color:#4ade80;">
              ${params.txnamount ? 'Rs. ' + esc(params.txnamount) : '—'}
            </span>
          </div>
        </div>
      `;

      modalActions.innerHTML = `
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Close</button>
        <a href="/" class="btn btn-primary">Done / Return</a>
      `;
    }

    function openModal() {
      populateModal();
      const backdrop = document.getElementById('modalBackdrop');
      backdrop.classList.add('open');
    }

    function closeModal() {
      const backdrop = document.getElementById('modalBackdrop');
      backdrop.classList.remove('open');
    }

    // Close on backdrop click
    document.getElementById('modalBackdrop').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) {
        closeModal();
      }
    });

    // Automatically open the dialogue on page load so user sees it right away!
    setTimeout(openModal, 250);
  </script>

</body>
</html>
